<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geocoins">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Geocoins & Tags · Col·lecció</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--soft:#eef1f6;--ink:#0f1729;--mute:#64708a;--line:#e2e7f0;
--accent:#2d4fb5;--accent-soft:#e8edfb;--accent-ink:#1f3a8a;--on-accent:#fff;--tag:#9a5509;--tag-soft:#fcf0dd}
@media (prefers-color-scheme:dark){:root{--bg:#0d111a;--card:#151b27;--soft:#1c2433;--ink:#e8ecf5;--mute:#8b97b0;--line:#262f42;
--accent:#8aa4ff;--accent-soft:#1d2848;--accent-ink:#bccaff;--on-accent:#0d111a;--tag:#f0b46a;--tag-soft:#35280f}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,var(--bg)),var(--bg) 380px) no-repeat,var(--bg);
padding:env(safe-area-inset-top) max(20px,env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:3px;background:var(--accent);z-index:5}
main{max-width:1160px;margin:0 auto}
header{padding:44px 0 26px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:46px;height:46px;border-radius:12px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2)}
h1{margin:0;font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.sub{color:var(--mute);margin:3px 0 0;font-size:13px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
#install{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.sg:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.code:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip span{opacity:.55;margin-left:3px}
.chip.tp::before,.badge::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.chip.tp[aria-pressed=true]::before{box-shadow:0 0 0 2px var(--on-accent)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.sg{border:0;background:transparent;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mute);font-weight:500}
.sg[aria-pressed=true]{background:var(--card);color:var(--accent-ink);box-shadow:0 1px 3px rgba(15,23,41,.16);font-weight:600}
.sg span{opacity:.6;margin-left:3px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.bar input[type=search]{flex:1 1 240px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bar select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bar input:focus,.bar select:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start;transition:box-shadow .2s,transform .2s,border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 10px 28px rgba(15,23,41,.09);transform:translateY(-2px)}
.card.big{flex-direction:column;align-items:stretch}
.pics{display:flex;gap:10px;justify-content:center;align-items:center;background:var(--soft);border-radius:10px;padding:16px;min-height:150px}
.pics img{flex:0 1 auto;min-width:0;max-width:calc(50% - 6px);max-height:180px;width:auto;height:auto;object-fit:contain;border-radius:0;display:block;background:transparent}
.coin{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:12px;letter-spacing:.04em}
.body{min-width:0;flex:1}
.title{font-weight:600;margin:0 0 6px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.badge{display:inline-flex;align-items:center;color:var(--ink);font-weight:600}
.qty{font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:0 7px}
.row{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);min-width:58px}
.lbl.tg{color:var(--tag)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;border:1px solid transparent;border-radius:8px;padding:3px 9px;background:var(--accent-soft);color:var(--accent-ink);cursor:pointer}
.code:hover{border-color:var(--accent)}
.code.tg{background:var(--tag-soft);color:var(--tag)}
.code.tg:hover{border-color:var(--tag)}
.code.ok{border-color:var(--ink)}
.code.pend{background:var(--tag-soft);color:var(--tag);font-family:inherit}
.card.pend{background:color-mix(in srgb,var(--tag) 7%,var(--card));border-color:color-mix(in srgb,var(--tag) 28%,var(--line))}
.card.pend .pics{background:color-mix(in srgb,var(--tag) 8%,var(--soft))}
a.go{font-size:12.5px;font-weight:500;color:var(--accent);text-decoration:none}
a.go:hover{text-decoration:underline}
.empty,.msg{padding:32px;text-align:center;color:var(--mute)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-align:left}
.msg code{background:var(--soft);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <img class="logo" src="icon-192.png" alt="">
    <div>
      <h1>Geocoins &amp; Tags</h1>
      <p class="sub" id="status">Carregant el full…</p>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="install" type="button" hidden>Instal·la l'app</button><button class="btn" id="refresh" type="button">Actualitza des del full</button></div>
</header>
<div class="chips" id="quick" style="align-items:center">
  <div class="seg" id="kind" role="group" aria-label="Tipus d'element">
    <button type="button" class="sg" data-k="" aria-pressed="true">Totes <span id="n-all"></span></button>
        <button type="button" class="sg" data-k="Geocoin" aria-pressed="false">Geocoins <span id="n-coin"></span></button>
    <button type="button" class="sg" data-k="Tag" aria-pressed="false">Tags <span id="n-tag"></span></button>
  </div>
  <button type="button" class="chip" id="dup" aria-pressed="false">Repetits (més d'una unitat) <span id="n-dup"></span></button>
</div>
<div class="chips" id="types" role="group" aria-label="Tipus"></div>
<div class="bar">
  <input type="search" id="q" placeholder="Cerca per nom, codi o lloc" aria-label="Cerca">
  <select id="year" aria-label="Any"></select>
  <select id="sort" aria-label="Ordre">
    <option value="date-desc">Data: més recents</option>
    <option value="date-asc">Data: més antics</option>
    <option value="name">Nom A–Z</option>
  </select>
</div>
<div id="out"></div>
</main>

<script>
const SHEET_ID = "1PspmMmUEz9AVBAahFeVlrwuQnus3rfqvoNtieHED-bs";
const TABS = ["Coins", "Tags"]; // noms de les pestanyes del full
const TYPES = [
  ["MEGA", /\bMEGA\b/i, "--t-mega"], ["GIGA", /\bGIGA\b/i, "--t-giga"], ["MAZE", /\bMAZE\b/i, "--t-maze"],
  ["Block Party", /block ?part/i, "--t-block"], ["Community", /comm?unity/i, "--t-event"],
  ["Event", /\bevent\b/i, "--t-event"], ["Lackeys", /lackeys/i, "--t-lackeys"]
];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items = [], state = {kind: "", dup: false, section: "", type: "", year: "", q: "", sort: "date-desc"};

function parseCSV(text) {
  const rows = []; let row = [], f = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else inQ = false; } else f += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function toDate(s) {
  let m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

const norm = x => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
const isImg = u => /\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(u) || /drive\.google\.com\/(file\/d\/|open\?id=|uc\?|thumbnail)|lh3\.googleusercontent\.com/i.test(u);
const toImg = u => { const m = u.match(/\/file\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/); return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w600` : u; };

// Llegeix les files segons els noms de columna de la fila de capçalera (Nom, Codi, Enllaç, Quantitat, Frontal, Dors)
// Separa els codis d'una cel·la (un per línia, o separats per coma, punt i coma, barra, o espais)
function parseCodes(text) {
  const out = [];
  String(text || "").split(/[\n,;\/|]+/).forEach(seg => {
    seg = seg.trim(); if (!seg) return;
    const m = seg.match(/[A-Z0-9]{4,9}(?:\s*\([^)]*\))?/g);
    if (m && m.length > 1) m.forEach(x => out.push(x.trim())); else out.push(seg);
  });
  return out;
}

// Seccions del full -> tipus (per si la columna Tipus està buida)
function typeFromSection(sec, tab) {
  if (/trobad/i.test(sec)) return "Trobades";
  if (/\bhq\b/i.test(sec)) return "HQ";
  if (/lackeys\s*personal/i.test(sec)) return "Lackeys personal";
  if (/lackeys|lakeys/i.test(sec)) return "Lackeys";
  if (/personal/i.test(sec)) return tab === "Tags" ? "Personals" : "Personal";
  if (/catalan/i.test(sec)) return "Catalanes";
  return "Variades";
}

// Llegeix les files segons els noms de columna de la fila de capçalera (Tipus, Nom, Codi, Enllaç, Quantitat, Frontal, Dors)
function parseRows(rows, tab) {
  let hi = rows.findIndex(r => r.some(c => norm(c) === "codi") && r.some(c => norm(c) === "nom"));
  let H = hi >= 0 ? rows[hi].map(norm) : ["tipus", "frontal", "dors", "nom", "codi", "enllac", "quantitat", "frontal", "dors"];
  if (hi < 0) hi = 0;
  const idx = n => H.indexOf(n);
  const iTipus = ["tipus", "tipo", "type", "categoria"].map(idx).find(i => i >= 0) ?? -1;
  const iNom = idx("nom"), iCodi = idx("codi"), iUrl = idx("enllac"), iQty = idx("quantitat");
  const fr = [], dr = [];
  H.forEach((h, i) => { if (h === "frontal") fr.push(i); if (h === "dors") dr.push(i); });
  const out = []; let section = "";
  rows.forEach((r, ri) => {
    if (ri <= hi) return; // la fila de noms de camp no és una fitxa
    const v = r.map(c => String(c == null ? "" : c).trim());
    const filled = v.filter(Boolean);
    if (!filled.length) return;
    const get = i => (i >= 0 ? v[i] || "" : "");
    if (filled.length === 1 && !get(iCodi) && !/https?:/.test(filled[0])) { section = filled[0]; return; }
    const nom = get(iNom);
    const date = toDate(nom) || toDate(v.join(" "));
    const title = nom.split("\n").map(l => l.replace(/\d{1,2}\/\d{1,2}\/\d{4}/, "").trim()).filter(Boolean).join(" · ");
    const codes = parseCodes(get(iCodi));
    if (!title && !codes.length) return;
    // Columna Enllaç: pot tenir una URL i/o un codi vinculat (a Coins és el d'un Tag; a Tags és el d'una Geocoin)
    const link = get(iUrl);
    const url = (link.match(/https?:\/\/\S+/) || [""])[0];
    const tagCodes = parseCodes(link.replace(/https?:\/\/\S+/g, " ")).filter(c => /\b[A-Z0-9]{4,9}\b/.test(c) || /\bx\s*activar\b/i.test(c));
    const q = parseInt(get(iQty), 10);
    const pick = list => { for (const i of list) { const u = (get(i).match(/https?:\/\/\S+/) || [""])[0]; if (u && isImg(u)) return toImg(u); } return ""; };
    const images = [pick(fr), pick(dr)].filter(Boolean);
    const type = get(iTipus).split("\n")[0].trim() || typeFromSection(section, tab);
    const yr = date ? date.getFullYear() : ((title.match(/20\d\d/) || [""])[0]);
    out.push({images, title: title || codes[0], codes, tagCodes, url, date, year: String(yr || ""), type, color: colorOf(type),
      section: section || "General", tab, kind: tab === "Tags" ? "Tag" : "Geocoin", qty: isNaN(q) ? 1 : q});
  });
  return out;
}

const TYPE_ALIAS = {volutaris: "voluntaris", voluntari: "voluntaris", trobada: "trobades", variada: "variades", catalana: "catalanes",
  lakeys: "lackeys", personals: "personal", lackeyspersonals: "lackeyspersonal"};
const typeKey = t => { const k = norm(t).replace(/[^a-z0-9]/g, ""); return TYPE_ALIAS[k] || k; };
const typeMatch = (itemType, chip) => typeKey(itemType) === typeKey(chip);
const COIN_TYPES = ["Trobades", "HQ", "Lackeys", "Personal", "Catalanes", "Variades"];
const TAG_TYPES = ["Trobades", "HQ", "Lackeys personal", "Lackeys", "Personals", "Voluntaris", "Signal", "Variades"];
const TYPE_COLORS = {trobades: "#3b7ea1", hq: "#8a6d3b", lackeys: "#b0643a", personal: "#8b5e83", personals: "#8b5e83", catalanes: "#b4443c",
  variades: "#6b7a8f", lackeyspersonal: "#a3604f", lakeys: "#b0643a", voluntaris: "#4f8a6b", signal: "#5b6fb5"};
function colorOf(t) {
  const k = typeKey(t);
  if (TYPE_COLORS[k]) return TYPE_COLORS[k];
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 40% 48%)`;
}

function gviz(tab) {
  // Càrrega via <script> (JSONP): no depèn de CORS i funciona també obrint el fitxer en local
  return new Promise((resolve, reject) => {
    const cb = "__gv" + Math.random().toString(36).slice(2);
    const sc = document.createElement("script");
    const done = () => { clearTimeout(tm); delete window[cb]; sc.remove(); };
    const tm = setTimeout(() => { done(); reject(new Error((tab || "primera pestanya") + ": temps d'espera esgotat")); }, 12000);
    window[cb] = d => { done(); d && d.status === "ok" ? resolve(d.table) : reject(new Error((tab || "primera pestanya") + ": " + (d && d.errors ? d.errors.map(e => e.detailed_message || e.message).join(" ") : "resposta no vàlida"))); };
    sc.onerror = () => { done(); reject(new Error((tab || "primera pestanya") + ": no s'ha pogut connectar amb Google")); };
    sc.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&tqx=responseHandler:${cb}` + (tab ? "&sheet=" + encodeURIComponent(tab) : "");
    document.head.appendChild(sc);
  });
}

async function loadTab(tab, named) {
  const table = await gviz(named ? tab : "");
  const rows = table.rows.map(r => (r.c || []).map(c => c ? (c.f != null ? c.f : (c.v != null ? c.v : "")) : "").map(String));
  rows.unshift((table.cols || []).map(c => c.label || ""));
  return parseRows(rows, tab);
}

const CACHE_KEY = "coins-data-v2", IMG_CACHE = "coins-img-v1";

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), items: items.map(i => ({...i, date: i.date ? i.date.getTime() : null}))})); } catch (_) {}
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!c || !Array.isArray(c.items) || !c.items.length) return null;
    c.items = c.items.map(i => ({...i, kind: i.kind === "Coin" ? "Geocoin" : i.kind, tagCodes: i.tagCodes || [], date: i.date ? new Date(i.date) : null}));
    return c;
  } catch (_) { return null; }
}

// Desa totes les imatges al dispositiu perquè es vegin sense connexió
async function precache() {
  if (!("caches" in window)) return;
  try {
    const c = await caches.open(IMG_CACHE);
    const urls = [...new Set(items.flatMap(i => i.images))];
    const q = [...urls]; let ok = 0;
    const work = async () => {
      while (q.length) {
        const u = q.shift();
        try {
          if (await c.match(u)) { ok++; continue; }
          const r = await fetch(u, {mode: "cors", credentials: "omit"});
          if (r.ok) { await c.put(u, r); ok++; }
        } catch (_) {}
      }
    };
    await Promise.all([work(), work(), work(), work()]);
    if (urls.length) $("status").textContent += ` · ${ok}/${urls.length} imatges disponibles sense connexió`;
  } catch (_) {}
}

async function load() {
  $("status").textContent = "Carregant el full…";
  try {
    const res = await Promise.allSettled([loadTab("Coins", false), loadTab("Tags", true)]);
    const lists = res.map(r => r.status === "fulfilled" ? r.value : []);
    const sig = l => l.map(i => i.title + "|" + i.codes.join(",")).join("¦");
    // si la pestanya «Tags» no existeix, Google retorna la primera pestanya: en aquest cas no la dupliquem
    if (lists[1].length && sig(lists[0]) === sig(lists[1])) lists[1] = [];
    items = lists.flat();
    if (!items.length) throw new Error(res.map(r => r.reason && r.reason.message).filter(Boolean).join(" | ") || "Sense dades");
    $("status").textContent = `${items.length} elements · actualitzat ${new Date().toLocaleTimeString("ca")}`;
    if (res[0].status === "fulfilled") saveCache();
    buildFilters(); render(); precache();
  } catch (e) {
    const cached = loadCache();
    if (cached) {
      items = cached.items;
      $("status").textContent = `Sense connexió · dades del ${new Date(cached.t).toLocaleString("ca", {dateStyle: "medium", timeStyle: "short"})}`;
      buildFilters(); render();
      return;
    }
    $("status").textContent = "No s'ha pogut carregar el full";
    $("out").innerHTML = `<div class="msg"><b>No s'ha pogut llegir el full de Google.</b><p>Comprova que el full està compartit com a «Qualsevol persona amb l'enllaç → Lector», que les pestanyes es diuen <code>${TABS.join("</code> i <code>")}</code> i que tens connexió. Si obres el fitxer des d'un entorn restringit (previsualitzador, correu), prova-ho des del navegador.</p><p style="color:var(--mute)">Detall tècnic: ${esc(e.message)}</p></div>`;
  }
}

const pool = () => items.filter(i => !state.kind || i.kind === state.kind);

// Els filtres de tipus canvien segons el botó triat: Geocoins, Tags o Totes
function buildTypes() {
  const list = state.kind === "Geocoin" ? COIN_TYPES : state.kind === "Tag" ? TAG_TYPES
    : [...new Map([...COIN_TYPES, ...TAG_TYPES].map(t => [typeKey(t), t])).values()];
  const p = pool();
  if (state.type && !list.some(t => typeKey(t) === typeKey(state.type))) state.type = "";
  $("types").innerHTML = list.map(t => `<button type="button" class="chip tp" style="--c:${esc(colorOf(t))}" data-t="${esc(t)}" aria-pressed="${typeKey(state.type) === typeKey(t) && !!state.type}">${esc(t)} <span>${p.filter(i => typeMatch(i.type, t, p)).length}</span></button>`).join("");
}

function buildFilters() {
  const yrs = [...new Set(items.map(i => i.year).filter(Boolean))].sort().reverse();
  $("year").innerHTML = `<option value="">Tots els anys</option>` + yrs.map(v => `<option>${esc(v)}</option>`).join("");
  buildTypes();
}

function render() {
  const q = state.q.toLowerCase();
  let list = items.filter(i =>
    (!state.kind || i.kind === state.kind) && (!state.dup || i.qty > 1) && (!state.type || typeMatch(i.type, state.type, pool())) &&
    (!state.year || i.year === state.year) &&
    (!q || (i.title + " " + i.codes.join(" ") + " " + (i.tagCodes || []).join(" ")).toLowerCase().includes(q)));
  const by = state.sort;
  list.sort((a, b) => by === "name" ? a.title.localeCompare(b.title, "ca")
    : ((a.date || 0) - (b.date || 0)) * (by === "date-asc" ? 1 : -1));
  const dups = items.filter(i => i.qty > 1).length;
  $("n-all").textContent = items.length;
  $("n-coin").textContent = items.filter(i => i.kind === "Geocoin").length;
  $("n-tag").textContent = items.filter(i => i.kind === "Tag").length;
  $("n-dup").textContent = dups;
  $("out").innerHTML = list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">Cap resultat. Prova de treure algun filtre.</div>`;
  fixImages();
}


// Treu el fons negre o blanc incrustat (només si les 4 cantonades són d'aquest color) i el fa transparent
function transparentize(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h || w * h > 4e6) return;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", {willReadFrequently: true}); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, w, h), px = d.data;
  const cor = [0, w - 1, (h - 1) * w, h * w - 1].map(i => [px[i*4], px[i*4+1], px[i*4+2], px[i*4+3]]);
  if (cor.some(p => p[3] < 250)) return;
  const m = [0, 1, 2].map(k => cor.reduce((a, p) => a + p[k], 0) / 4);
  if (!cor.every(p => Math.abs(p[0]-m[0]) + Math.abs(p[1]-m[1]) + Math.abs(p[2]-m[2]) < 60)) return;
  const lum = (m[0] + m[1] + m[2]) / 3;
  if (lum > 60 && lum < 200) return;
  const dist = i => Math.abs(px[i*4]-m[0]) + Math.abs(px[i*4+1]-m[1]) + Math.abs(px[i*4+2]-m[2]);
  const TOL = 60, gone = new Uint8Array(w * h), st = [];
  const seed = i => { if (!gone[i] && dist(i) <= TOL) { gone[i] = 1; st.push(i); } };
  for (let i = 0; i < w; i++) { seed(i); seed((h - 1) * w + i); }
  for (let j = 0; j < h; j++) { seed(j * w); seed(j * w + w - 1); }
  while (st.length) {
    const i = st.pop(), cx = i % w;
    if (cx > 0) seed(i - 1); if (cx < w - 1) seed(i + 1);
    if (i >= w) seed(i - w); if (i < w * (h - 1)) seed(i + w);
  }
  for (let i = 0; i < w * h; i++) {
    if (gone[i]) { px[i*4+3] = 0; continue; }
    const cx = i % w;
    const near = (cx > 0 && gone[i-1]) || (cx < w-1 && gone[i+1]) || (i >= w && gone[i-w]) || (i < w*(h-1) && gone[i+w]);
    if (near && dist(i) <= TOL * 2.5) px[i*4+3] = 120;
  }
  x.putImageData(d, 0, 0);
  img.src = c.toDataURL("image/png");
}

function fixImages() {
  document.querySelectorAll(".pics img:not([data-fx])").forEach(img => {
    img.dataset.fx = "0";
    const run = () => { if (img.dataset.fx === "1") return; img.dataset.fx = "1"; try { transparentize(img); } catch (_) {} };
    img.addEventListener("error", () => { if (img.hasAttribute("crossorigin")) { img.removeAttribute("crossorigin"); img.src = img.src; } }, {once: true});
    img.complete && img.naturalWidth ? run() : img.addEventListener("load", run, {once: true});
  });
}

function card(i) {
  const d = i.date ? i.date.toLocaleDateString("ca", {day: "numeric", month: "short", year: "numeric"}) : "";
  const ab = i.type.slice(0, 3).toUpperCase();
  const pic = i.images.length
    ? `<div class="pics">${i.images.map((u, n) => `<img src="${esc(u)}" alt="${esc(i.title)} (${n ? "darrere" : "davant"})" loading="lazy" crossorigin="anonymous" referrerpolicy="no-referrer">`).join("")}</div>`
    : `<div class="coin" aria-hidden="true">${esc(ab)}</div>`;
  const chip = (c, cls) => `<button type="button" class="code${cls ? " " + cls : ""}${/\bx\s*activar\b/i.test(c) ? " pend" : ""}" data-c="${esc((c.match(/[A-Z0-9]{4,9}/) || [c])[0])}" title="Copia el codi">${esc(c)}</button>`;
  const tc = i.tagCodes || [];
  const pend = [...i.codes, ...tc].some(c => /\bx\s*activar\b/i.test(c));
  return `<article class="card${i.images.length ? " big" : ""}${pend ? " pend" : ""}" style="--c:${esc(i.color)}">${pic}
  <div class="body"><p class="title">${esc(i.title)}</p>
  <div class="meta"><span class="badge">${esc(i.type)}</span>${d ? `<span>${esc(d)}</span>` : ""}<span>${i.kind}</span>${i.qty > 1 ? `<span class="qty">×${i.qty}</span>` : ""}</div>
  ${i.codes.length ? `<div class="row"><span class="lbl">${i.codes.length > 1 ? "Codis" : "Codi"}</span>${i.codes.map(c => chip(c, "")).join("")}</div>` : ""}
  ${tc.length ? `<div class="row"><span class="lbl tg">${i.kind === "Tag" ? "Geocoin" : "Tag"}</span>${tc.map(c => chip(c, "tg")).join("")}</div>` : ""}
  ${i.url ? `<div class="row"><a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Obre a geocaching.com ↗</a></div>` : ""}</div></article>`;
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("types").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.type = typeKey(state.type) === typeKey(b.dataset.t) ? "" : b.dataset.t;
  [...$("types").children].forEach(c => c.setAttribute("aria-pressed", !!state.type && typeKey(c.dataset.t) === typeKey(state.type)));
  render();
});
$("year").addEventListener("change", e => { state.year = e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("refresh").addEventListener("click", load);
$("kind").addEventListener("click", e => {
  const b = e.target.closest(".sg"); if (!b) return;
  state.kind = b.dataset.k;
  [...$("kind").children].forEach(c => c.setAttribute("aria-pressed", c.dataset.k === state.kind));
  buildTypes(); render();
});
$("dup").addEventListener("click", e => {
  state.dup = !state.dup; e.currentTarget.setAttribute("aria-pressed", state.dup); render();
});
$("out").addEventListener("click", e => {
  const b = e.target.closest(".code"); if (!b) return;
  try { navigator.clipboard.writeText(b.dataset.c); } catch (_) {}
  b.classList.add("ok"); const t = b.textContent; b.textContent = "Copiat";
  setTimeout(() => { b.textContent = t; b.classList.remove("ok"); }, 1000);
});

let installEv = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEv = e; $("install").hidden = false; });
$("install").addEventListener("click", async () => { if (!installEv) return; installEv.prompt(); await installEv.userChoice; installEv = null; $("install").hidden = true; });
window.addEventListener("appinstalled", () => { $("install").hidden = true; });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

const first = loadCache();
if (first) { items = first.items; buildFilters(); render(); $("status").textContent = "Actualitzant…"; }
load();
</script>
