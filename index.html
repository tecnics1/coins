<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coins">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Coins & Tags · Col·lecció</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f7f7f5;--card:#fff;--soft:#f0f0ed;--ink:#14161a;--mute:#6c7280;--line:#e8e8e4}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#16191e;--soft:#1e2228;--ink:#eceef1;--mute:#8d94a1;--line:#272c34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) max(20px,env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));-webkit-font-smoothing:antialiased}
main{max-width:1160px;margin:0 auto}
header{padding:44px 0 26px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.03em}
.sub{color:var(--mute);margin:6px 0 0;font-size:13.5px}
button,select,input{font:inherit;color:inherit}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--soft)}
.btn:focus-visible,.chip:focus-visible,.sg:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.code:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px;transition:border-color .15s}
.chip:hover{border-color:var(--mute)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{opacity:.5;margin-left:3px}
.chip.tp::before,.badge::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.sg{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mute)}
.sg[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.sg span{opacity:.55;margin-left:3px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.bar input[type=search]{flex:1 1 240px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bar select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:flex-start;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 10px 28px rgba(0,0,0,.08);transform:translateY(-2px)}
.card.big{flex-direction:column;align-items:stretch}
.pics{display:flex;gap:10px;justify-content:center;align-items:center;background:var(--soft);border-radius:12px;padding:16px;min-height:150px}
.pics img{flex:0 1 auto;min-width:0;max-width:calc(50% - 6px);max-height:180px;width:auto;height:auto;object-fit:contain;border-radius:0;display:block;background:transparent}
.coin{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--mute);font-weight:600;font-size:12px}
.body{min-width:0;flex:1}
.title{font-weight:600;margin:0 0 6px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.badge{display:inline-flex;align-items:center;color:var(--ink);font-weight:600}
.qty{font-weight:700;color:var(--ink);background:var(--soft);border-radius:6px;padding:0 6px}
.row{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:transparent;cursor:pointer}
.code:hover{background:var(--soft)}
.code.ok{border-color:var(--ink)}
a.go{font-size:12.5px;color:var(--mute);text-decoration:none;margin-left:auto}
a.go:hover{color:var(--ink);text-decoration:underline}
.empty,.msg{padding:32px;text-align:center;color:var(--mute)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-align:left}
.msg code{background:var(--soft);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Coins &amp; Tags</h1>
    <p class="sub" id="status">Carregant el full…</p>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="install" type="button" hidden>Instal·la l'app</button><button class="btn" id="refresh" type="button">Actualitza des del full</button></div>
</header>
<div class="chips" id="quick" style="align-items:center">
  <div class="seg" id="kind" role="group" aria-label="Tipus d'element">
    <button type="button" class="sg" data-k="" aria-pressed="true">Totes <span id="n-all"></span></button>
        <button type="button" class="sg" data-k="Geocoin" aria-pressed="false">Geocoins <span id="n-coin"></span></button>
    <button type="button" class="sg" data-k="Tag" aria-pressed="false">Tags <span id="n-tag"></span></button>
  </div>
  <button type="button" class="chip" id="dup" aria-pressed="false">Repetits (més d'una unitat) <span id="n-dup"></span></button>
</div>
<div class="chips" id="types" role="group" aria-label="Tipus"></div>
<div class="bar">
  <input type="search" id="q" placeholder="Cerca per nom, codi o lloc" aria-label="Cerca">
  <select id="year" aria-label="Any"></select>
  <select id="sort" aria-label="Ordre">
    <option value="date-desc">Data: més recents</option>
    <option value="date-asc">Data: més antics</option>
    <option value="name">Nom A–Z</option>
  </select>
</div>
<div class="chips" id="sections" role="group" aria-label="Seccions"></div>
<div id="out"></div>
</main>

<script>
const SHEET_ID = "1PspmMmUEz9AVBAahFeVlrwuQnus3rfqvoNtieHED-bs";
const TABS = ["Coins", "Tags"]; // noms de les pestanyes del full
const TYPES = [
  ["MEGA", /\bMEGA\b/i, "--t-mega"], ["GIGA", /\bGIGA\b/i, "--t-giga"], ["MAZE", /\bMAZE\b/i, "--t-maze"],
  ["Block Party", /block ?part/i, "--t-block"], ["Community", /comm?unity/i, "--t-event"],
  ["Event", /\bevent\b/i, "--t-event"], ["Lackeys", /lackeys/i, "--t-lackeys"]
];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items = [], state = {kind: "", dup: false, section: "", type: "", year: "", q: "", sort: "date-desc"};

function parseCSV(text) {
  const rows = []; let row = [], f = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else inQ = false; } else f += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function toDate(s) {
  let m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

const norm = x => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
const isImg = u => /\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(u) || /drive\.google\.com\/(file\/d\/|open\?id=|uc\?|thumbnail)|lh3\.googleusercontent\.com/i.test(u);
const toImg = u => { const m = u.match(/\/file\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/); return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w600` : u; };

// Llegeix les files segons els noms de columna de la fila de capçalera (Nom, Codi, Enllaç, Quantitat, Frontal, Dors)
function parseRows(rows, tab) {
  let hi = rows.findIndex(r => r.some(c => norm(c) === "codi") && r.some(c => norm(c) === "nom"));
  let H = hi >= 0 ? rows[hi].map(norm) : ["frontal", "dors", "nom", "codi", "enllac", "quantitat", "frontal", "dors"];
  if (hi < 0) hi = 0;
  const idx = n => H.indexOf(n);
  const iTipus = ["tipus", "tipo", "type", "categoria"].map(idx).find(i => i >= 0) ?? -1;
  const iNom = idx("nom"), iCodi = idx("codi"), iUrl = idx("enllac"), iQty = idx("quantitat");
  const fr = [], dr = [];
  H.forEach((h, i) => { if (h === "frontal") fr.push(i); if (h === "dors") dr.push(i); });
  const out = []; let section = "";
  rows.forEach((r, ri) => {
    if (ri <= hi) return; // la fila de noms de camp no és una fitxa
    const v = r.map(c => String(c == null ? "" : c).trim());
    const filled = v.filter(Boolean);
    if (!filled.length) return;
    const get = i => (i >= 0 ? v[i] || "" : "");
    if (filled.length === 1 && !get(iCodi) && !/https?:/.test(filled[0])) { section = filled[0]; return; }
    const nom = get(iNom);
    const date = toDate(nom) || toDate(v.join(" "));
    const title = nom.split("\n").map(l => l.replace(/\d{1,2}\/\d{1,2}\/\d{4}/, "").trim()).filter(Boolean).join(" · ");
    const codes = get(iCodi).split(/[\n,;]+/).map(c => c.trim()).filter(Boolean);
    if (!title && !codes.length) return;
    const url = (get(iUrl).match(/https?:\/\/\S+/) || [""])[0];
    const q = parseInt(get(iQty), 10);
    const pick = list => { for (const i of list) { const u = (get(i).match(/https?:\/\/\S+/) || [""])[0]; if (u && isImg(u)) return toImg(u); } return ""; };
    const images = [pick(fr), pick(dr)].filter(Boolean);
    const tv = get(iTipus).split("\n")[0].trim();
    const t = tv ? [tv] : (TYPES.find(t => t[1].test(title)) || (/personal/i.test(section) ? ["Personal"] : ["Altres"]));
    const yr = date ? date.getFullYear() : ((title.match(/20\d\d/) || [""])[0]);
    out.push({images, title: title || codes[0], codes, url, date, year: String(yr || ""), type: t[0], color: colorOf(t[0]),
      section: section || "General", tab, kind: (tab === "Tags" || isTagType(t[0])) ? "Tag" : "Geocoin", qty: isNaN(q) ? 1 : q});
  });
  return out;
}

const TYPE_COLORS = {mega: "#d99a1f", giga: "#d1472b", maze: "#1f8fbf", blockparty: "#8a4fd3", event: "#2e9d5b", community: "#e0559c",
  communitycelebration: "#e0559c", lackeys: "#c26a1b", personal: "#e0457b", personals: "#e0457b", altres: "#76817a"};
// Aquests tipus només es mostren a "Totes" i "Tags" (mai a "Geocoins")
const TAG_TYPES = ["lackeys", "lackeyspersonal", "personal", "personals", "signal", "voluntaris", "volutaris", "voluntari"];
function isTagType(t) { return TAG_TYPES.includes(norm(t).replace(/[^a-z0-9]/g, "")); }

function colorOf(t) {
  const k = norm(t).replace(/[^a-z0-9]/g, "");
  if (TYPE_COLORS[k]) return TYPE_COLORS[k];
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 62% 46%)`;
}

function gviz(tab) {
  // Càrrega via <script> (JSONP): no depèn de CORS i funciona també obrint el fitxer en local
  return new Promise((resolve, reject) => {
    const cb = "__gv" + Math.random().toString(36).slice(2);
    const sc = document.createElement("script");
    const done = () => { clearTimeout(tm); delete window[cb]; sc.remove(); };
    const tm = setTimeout(() => { done(); reject(new Error((tab || "primera pestanya") + ": temps d'espera esgotat")); }, 12000);
    window[cb] = d => { done(); d && d.status === "ok" ? resolve(d.table) : reject(new Error((tab || "primera pestanya") + ": " + (d && d.errors ? d.errors.map(e => e.detailed_message || e.message).join(" ") : "resposta no vàlida"))); };
    sc.onerror = () => { done(); reject(new Error((tab || "primera pestanya") + ": no s'ha pogut connectar amb Google")); };
    sc.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&tqx=responseHandler:${cb}` + (tab ? "&sheet=" + encodeURIComponent(tab) : "");
    document.head.appendChild(sc);
  });
}

async function loadTab(tab, named) {
  const table = await gviz(named ? tab : "");
  const rows = table.rows.map(r => (r.c || []).map(c => c ? (c.f != null ? c.f : (c.v != null ? c.v : "")) : "").map(String));
  rows.unshift((table.cols || []).map(c => c.label || ""));
  return parseRows(rows, tab);
}

const CACHE_KEY = "coins-data-v1", IMG_CACHE = "coins-img-v1";

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), items: items.map(i => ({...i, date: i.date ? i.date.getTime() : null}))})); } catch (_) {}
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!c || !Array.isArray(c.items) || !c.items.length) return null;
    c.items = c.items.map(i => ({...i, date: i.date ? new Date(i.date) : null}));
    return c;
  } catch (_) { return null; }
}

// Desa totes les imatges al dispositiu perquè es vegin sense connexió
async function precache() {
  if (!("caches" in window)) return;
  try {
    const c = await caches.open(IMG_CACHE);
    const urls = [...new Set(items.flatMap(i => i.images))];
    const q = [...urls]; let ok = 0;
    const work = async () => {
      while (q.length) {
        const u = q.shift();
        try {
          if (await c.match(u)) { ok++; continue; }
          const r = await fetch(u, {mode: "cors", credentials: "omit"});
          if (r.ok) { await c.put(u, r); ok++; }
        } catch (_) {}
      }
    };
    await Promise.all([work(), work(), work(), work()]);
    if (urls.length) $("status").textContent += ` · ${ok}/${urls.length} imatges disponibles sense connexió`;
  } catch (_) {}
}

async function load() {
  $("status").textContent = "Carregant el full…";
  try {
    const res = await Promise.allSettled([loadTab("Coins", false), loadTab("Tags", true)]);
    const seen = new Set();
    items = res.flatMap(r => r.status === "fulfilled" ? r.value : []).filter(i => {
      const k = i.title + "|" + i.codes.join(","); return seen.has(k) ? false : (seen.add(k), true);
    });
    if (!items.length) throw new Error(res.map(r => r.reason && r.reason.message).filter(Boolean).join(" | ") || "Sense dades");
    $("status").textContent = `${items.length} elements · actualitzat ${new Date().toLocaleTimeString("ca")}`;
    if (res[0].status === "fulfilled") saveCache();
    buildFilters(); render(); precache();
  } catch (e) {
    const cached = loadCache();
    if (cached) {
      items = cached.items;
      $("status").textContent = `Sense connexió · dades del ${new Date(cached.t).toLocaleString("ca", {dateStyle: "medium", timeStyle: "short"})}`;
      buildFilters(); render();
      return;
    }
    $("status").textContent = "No s'ha pogut carregar el full";
    $("out").innerHTML = `<div class="msg"><b>No s'ha pogut llegir el full de Google.</b><p>Comprova que el full està compartit com a «Qualsevol persona amb l'enllaç → Lector», que les pestanyes es diuen <code>${TABS.join("</code> i <code>")}</code> i que tens connexió. Si obres el fitxer des d'un entorn restringit (previsualitzador, correu), prova-ho des del navegador.</p><p style="color:var(--mute)">Detall tècnic: ${esc(e.message)}</p></div>`;
  }
}

const pool = () => items.filter(i => !state.kind || i.kind === state.kind);

function buildTypes() {
  const p = pool();
  const tp = [...new Set(p.map(i => i.type))].sort((a, b) => a.localeCompare(b, "ca"));
  if (state.type && !tp.includes(state.type)) state.type = "";
  $("types").innerHTML = tp.map(t => `<button type="button" class="chip tp" style="--c:${esc(colorOf(t))}" data-t="${esc(t)}" aria-pressed="${state.type === t}">${esc(t)} <span>${p.filter(i => i.type === t).length}</span></button>`).join("");
}

function buildSections() {
  const secs = [...new Set(pool().map(i => i.section))].filter(x => x && x !== "General");
  if (state.section && !secs.includes(state.section)) state.section = "";
  $("sections").innerHTML = secs.map(x => `<button type="button" class="chip" data-s="${esc(x)}" aria-pressed="${x === state.section}">${esc(x)}</button>`).join("");
}

function buildFilters() {
  const yrs = [...new Set(items.map(i => i.year).filter(Boolean))].sort().reverse();
  $("year").innerHTML = `<option value="">Tots els anys</option>` + yrs.map(v => `<option>${esc(v)}</option>`).join("");
  buildTypes(); buildSections();
}

function render() {
  const q = state.q.toLowerCase();
  let list = items.filter(i =>
    (!state.kind || i.kind === state.kind) && (!state.dup || i.qty > 1) && (!state.section || i.section === state.section) && (!state.type || i.type === state.type) &&
    (!state.year || i.year === state.year) &&
    (!q || (i.title + " " + i.codes.join(" ")).toLowerCase().includes(q)));
  const by = state.sort;
  list.sort((a, b) => by === "name" ? a.title.localeCompare(b.title, "ca")
    : ((a.date || 0) - (b.date || 0)) * (by === "date-asc" ? 1 : -1));
  const dups = items.filter(i => i.qty > 1).length;
  $("n-all").textContent = items.length;
  $("n-coin").textContent = items.filter(i => i.kind === "Geocoin").length;
  $("n-tag").textContent = items.filter(i => i.kind === "Tag").length;
  $("n-dup").textContent = dups;
  $("out").innerHTML = list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">Cap resultat. Prova de treure algun filtre.</div>`;
  fixImages();
}


// Treu el fons negre o blanc incrustat (només si les 4 cantonades són d'aquest color) i el fa transparent
function transparentize(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h || w * h > 4e6) return;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", {willReadFrequently: true}); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, w, h), px = d.data;
  const cor = [0, w - 1, (h - 1) * w, h * w - 1].map(i => [px[i*4], px[i*4+1], px[i*4+2], px[i*4+3]]);
  if (cor.some(p => p[3] < 250)) return;
  const m = [0, 1, 2].map(k => cor.reduce((a, p) => a + p[k], 0) / 4);
  if (!cor.every(p => Math.abs(p[0]-m[0]) + Math.abs(p[1]-m[1]) + Math.abs(p[2]-m[2]) < 60)) return;
  const lum = (m[0] + m[1] + m[2]) / 3;
  if (lum > 60 && lum < 200) return;
  const dist = i => Math.abs(px[i*4]-m[0]) + Math.abs(px[i*4+1]-m[1]) + Math.abs(px[i*4+2]-m[2]);
  const TOL = 60, gone = new Uint8Array(w * h), st = [];
  const seed = i => { if (!gone[i] && dist(i) <= TOL) { gone[i] = 1; st.push(i); } };
  for (let i = 0; i < w; i++) { seed(i); seed((h - 1) * w + i); }
  for (let j = 0; j < h; j++) { seed(j * w); seed(j * w + w - 1); }
  while (st.length) {
    const i = st.pop(), cx = i % w;
    if (cx > 0) seed(i - 1); if (cx < w - 1) seed(i + 1);
    if (i >= w) seed(i - w); if (i < w * (h - 1)) seed(i + w);
  }
  for (let i = 0; i < w * h; i++) {
    if (gone[i]) { px[i*4+3] = 0; continue; }
    const cx = i % w;
    const near = (cx > 0 && gone[i-1]) || (cx < w-1 && gone[i+1]) || (i >= w && gone[i-w]) || (i < w*(h-1) && gone[i+w]);
    if (near && dist(i) <= TOL * 2.5) px[i*4+3] = 120;
  }
  x.putImageData(d, 0, 0);
  img.src = c.toDataURL("image/png");
}

function fixImages() {
  document.querySelectorAll(".pics img:not([data-fx])").forEach(img => {
    img.dataset.fx = "0";
    const run = () => { if (img.dataset.fx === "1") return; img.dataset.fx = "1"; try { transparentize(img); } catch (_) {} };
    img.addEventListener("error", () => { if (img.hasAttribute("crossorigin")) { img.removeAttribute("crossorigin"); img.src = img.src; } }, {once: true});
    img.complete && img.naturalWidth ? run() : img.addEventListener("load", run, {once: true});
  });
}

function card(i) {
  const d = i.date ? i.date.toLocaleDateString("ca", {day: "numeric", month: "short", year: "numeric"}) : "";
  const ab = i.type === "Block Party" ? "BP" : i.type.slice(0, 4);
  const pic = i.images.length
    ? `<div class="pics">${i.images.map((u, n) => `<img src="${esc(u)}" alt="${esc(i.title)} (${n ? "darrere" : "davant"})" loading="lazy" crossorigin="anonymous" referrerpolicy="no-referrer">`).join("")}</div>`
    : `<div class="coin" style="--c:${esc(i.color)}" aria-hidden="true">${esc(ab)}</div>`;
  return `<article class="card${i.images.length ? " big" : ""}" style="--c:${esc(i.color)}">${pic}
  <div class="body"><p class="title">${esc(i.title)}</p>
  <div class="meta"><span class="badge">${esc(i.type)}</span>${d ? `<span>${esc(d)}</span>` : ""}<span>${esc(i.kind)}</span>${i.qty > 1 ? `<span class="qty">×${i.qty}</span>` : ""}</div>
  <div class="row">${i.codes.map(c => `<button type="button" class="code" data-c="${esc((c.match(/[A-Z0-9]{5,7}/) || [c])[0])}" title="Copia el codi">${esc(c)}</button>`).join("")}
  ${i.url ? `<a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Obre a geocaching.com</a>` : ""}</div></div></article>`;
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("types").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.type = state.type === b.dataset.t ? "" : b.dataset.t;
  [...$("types").children].forEach(c => c.setAttribute("aria-pressed", c.dataset.t === state.type));
  render();
});
$("year").addEventListener("change", e => { state.year = e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("refresh").addEventListener("click", load);
$("kind").addEventListener("click", e => {
  const b = e.target.closest(".sg"); if (!b) return;
  state.kind = b.dataset.k;
  [...$("kind").children].forEach(c => c.setAttribute("aria-pressed", c.dataset.k === state.kind));
  buildTypes(); buildSections(); render();
});
$("dup").addEventListener("click", e => {
  state.dup = !state.dup; e.currentTarget.setAttribute("aria-pressed", state.dup); render();
});
$("sections").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.section = state.section === b.dataset.s ? "" : b.dataset.s;
  [...$("sections").children].forEach(c => c.setAttribute("aria-pressed", c.dataset.s === state.section));
  render();
});
$("out").addEventListener("click", e => {
  const b = e.target.closest(".code"); if (!b) return;
  try { navigator.clipboard.writeText(b.dataset.c); } catch (_) {}
  b.classList.add("ok"); const t = b.textContent; b.textContent = "Copiat";
  setTimeout(() => { b.textContent = t; b.classList.remove("ok"); }, 1000);
});

let installEv = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEv = e; $("install").hidden = false; });
$("install").addEventListener("click", async () => { if (!installEv) return; installEv.prompt(); await installEv.userChoice; installEv = null; $("install").hidden = true; });
window.addEventListener("appinstalled", () => { $("install").hidden = true; });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

const first = loadCache();
if (first) { items = first.items; buildFilters(); render(); $("status").textContent = "Actualitzant…"; }
load();
</script>
</body>
